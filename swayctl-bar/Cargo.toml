[package]
name = "swayctl-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2.190"
pam-client = { version = "0.5.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[[bin]]
name = "swayctl-bar"
path = "src/main.rs"

[[bin]]
name = "swayctl-lock"
path = "src/lock/main.rs"
