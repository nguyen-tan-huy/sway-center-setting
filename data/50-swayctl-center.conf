# Installed by swayctl-center. Starts its settings daemon with this sway
# session's environment; the daemon then applies your settings over IPC.
# XDG_SESSION_TYPE isn't in the systemd/D-Bus environment on its own; without
# it apps opened from the launcher (a systemd unit) pick X11 and look blurry
# on scaled screens (Chrome, Electron...).
exec sh -c 'systemctl --user set-environment XDG_SESSION_TYPE=wayland && systemctl --user import-environment SWAYSOCK WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP; command -v dbus-update-activation-environment >/dev/null && dbus-update-activation-environment --systemd XDG_SESSION_TYPE=wayland SWAYSOCK WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP; systemctl --user restart swayctl-center.service'
